apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: bhilaitv
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/PROJECT_ID/bhilaitv:latest
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
        env:
        - name: PORT
          value: "8080"
        - name: ABHI_BASE_URL
          value: "https://abhilinks.site"
        - name: MOVIESHUNT_BASE_URL
          value: "https://movieshunt.casa"
        - name: HTTP_TIMEOUT
          value: "12.0"
